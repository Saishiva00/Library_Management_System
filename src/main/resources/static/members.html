<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Members - Library System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <h2>📚 Library Management System</h2>
    <div class="navbar-right">
        <span id="welcomeMsg"></span>
        <button class="logout-btn" onclick="logout()">
            🚪 Logout
        </button>
    </div>
</div>

<div class="layout">
    <div class="sidebar">
        <a href="dashboard.html"><span>🏠</span> Dashboard</a>
        <a href="books.html"><span>📖</span> Books</a>
        <a href="members.html" class="active">
            <span>👥</span> Members
        </a>
        <a href="borrow.html"><span>🔄</span> Borrow/Return</a>
    </div>

    <div class="main-content">
        <div class="page-title">👥 Member Management</div>

        <div id="alertMsg" class="alert"></div>

        <div class="search-bar">
            <input type="text"
                   id="searchInput"
                   placeholder="🔍 Search members..."
                   oninput="searchMembers()">
            <button class="btn btn-success"
                    onclick="openAddModal()">
                ➕ Add Member
            </button>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3>👥 All Members</h3>
                <span id="memberCount"
                      style="color:#666; font-size:14px;">
                    </span>
            </div>
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Membership ID</th>
                    <th>Valid Until</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="membersTable"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add/Edit Member Modal -->
<div id="memberModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitle">➕ Add New Member</h3>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <input type="hidden" id="memberId">

        <div class="form-group">
            <label>First Name *</label>
            <input type="text" id="firstName" placeholder="First name">
        </div>
        <div class="form-group">
            <label>Last Name *</label>
            <input type="text" id="lastName" placeholder="Last name">
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" placeholder="Email address">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="phone" placeholder="Phone number">
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" id="address" placeholder="Address">
        </div>
        <div class="form-group" id="statusGroup" style="display:none">
            <label>Status</label>
            <select id="status">
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
                <option value="SUSPENDED">Suspended</option>
            </select>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary"
                    onclick="saveMember()"
                    style="flex:1">
                💾 Save Member
            </button>
            <button class="btn btn-danger"
                    onclick="closeModal()"
                    style="flex:1">
                ✕ Cancel
            </button>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080';
    let allMembers = [];

    window.onload = function() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('welcomeMsg').textContent =
            `Welcome, ${user.fullName}!`;
        loadMembers();
    }

    async function loadMembers() {
        try {
            const res = await fetch(`${API}/api/members`);
            allMembers = await res.json();
            renderMembers(allMembers);
        } catch (error) {
            showAlert('Error loading members!', 'danger');
        }
    }

    function renderMembers(members) {
        const tbody = document.getElementById('membersTable');
        document.getElementById('memberCount').textContent =
            `Total: ${members.length} members`;

        if (members.length === 0) {
            tbody.innerHTML = `
                    <tr>
                        <td colspan="8"
                            style="text-align:center; color:#999;">
                            No members found!
                        </td>
                    </tr>`;
            return;
        }

        tbody.innerHTML = members.map((m, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${m.firstName} ${m.lastName}</strong></td>
                    <td>${m.email}</td>
                    <td>${m.phone || 'N/A'}</td>
                    <td>
                        <span class="badge badge-info">
                            ${m.membershipId}
                        </span>
                    </td>
                    <td>${m.membershipEndDate || 'N/A'}</td>
                    <td>
                        <span class="badge ${getStatusBadge(m.status)}">
                            ${m.status}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm"
                                onclick="editMember(${m.id})">
                            ✏️ Edit
                        </button>
                        <button class="btn btn-danger btn-sm"
                                onclick="deleteMember(${m.id})"
                                style="margin-left:5px">
                            🗑️ Delete
                        </button>
                    </td>
                </tr>
            `).join('');
    }

    function searchMembers() {
        const keyword = document.getElementById('searchInput')
            .value.toLowerCase();
        const filtered = allMembers.filter(m =>
            m.firstName.toLowerCase().includes(keyword) ||
            m.lastName.toLowerCase().includes(keyword) ||
            m.email.toLowerCase().includes(keyword)
        );
        renderMembers(filtered);
    }

    function openAddModal() {
        document.getElementById('modalTitle').textContent =
            '➕ Add New Member';
        document.getElementById('memberId').value = '';
        document.getElementById('firstName').value = '';
        document.getElementById('lastName').value = '';
        document.getElementById('email').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('address').value = '';
        document.getElementById('statusGroup').style.display = 'none';
        document.getElementById('memberModal').classList.add('show');
    }

    function editMember(id) {
        const member = allMembers.find(m => m.id === id);
        if (!member) return;

        document.getElementById('modalTitle').textContent =
            '✏️ Edit Member';
        document.getElementById('memberId').value = member.id;
        document.getElementById('firstName').value = member.firstName;
        document.getElementById('lastName').value = member.lastName;
        document.getElementById('email').value = member.email;
        document.getElementById('phone').value = member.phone || '';
        document.getElementById('address').value = member.address || '';
        document.getElementById('status').value = member.status;
        document.getElementById('statusGroup').style.display = 'block';
        document.getElementById('memberModal').classList.add('show');
    }

    async function saveMember() {
        const id = document.getElementById('memberId').value;
        const memberData = {
            firstName: document.getElementById('firstName').value.trim(),
            lastName: document.getElementById('lastName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            address: document.getElementById('address').value.trim(),
            status: document.getElementById('status').value || 'ACTIVE'
        };

        if (!memberData.firstName || !memberData.lastName ||
            !memberData.email) {
            showAlert('First name, Last name and Email are required!',
                'danger');
            return;
        }

        try {
            const url = id
                ? `${API}/api/members/${id}`
                : `${API}/api/members`;
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(memberData)
            });

            const data = await res.json();

            if (res.ok) {
                showAlert(
                    id ? 'Member updated!' : 'Member added!',
                    'success'
                );
                closeModal();
                loadMembers();
            } else {
                showAlert(data || 'Error saving member!', 'danger');
            }
        } catch (error) {
            showAlert('Connection error!', 'danger');
        }
    }

    async function deleteMember(id) {
        if (!confirm('Delete this member?')) return;

        try {
            const res = await fetch(`${API}/api/members/${id}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                showAlert('Member deleted!', 'success');
                loadMembers();
            } else {
                showAlert('Error deleting member!', 'danger');
            }
        } catch (error) {
            showAlert('Connection error!', 'danger');
        }
    }

    function getStatusBadge(status) {
        const badges = {
            'ACTIVE': 'badge-success',
            'INACTIVE': 'badge-warning',
            'SUSPENDED': 'badge-danger'
        };
        return badges[status] || 'badge-info';
    }

    function closeModal() {
        document.getElementById('memberModal').classList.remove('show');
    }

    function showAlert(message, type) {
        const alert = document.getElementById('alertMsg');
        alert.textContent = message;
        alert.className = `alert alert-${type} show`;
        setTimeout(() => alert.classList.remove('show'), 3000);
    }

    function logout() {
        localStorage.removeItem('user');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
