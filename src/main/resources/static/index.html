<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-container">
    <div class="login-box">

        <!-- Logo/Title -->
        <div style="text-align:center; margin-bottom:20px;">
            <div style="font-size:50px;">📚</div>
        </div>
        <h1>Library System</h1>
        <p>Sign in to your account</p>

        <!-- Alert Messages -->
        <div id="alertMsg" class="alert"></div>

        <!-- Login Form -->
        <div class="form-group">
            <label>Username</label>
            <input type="text"
                   id="username"
                   placeholder="Enter username"
                   onkeypress="handleEnter(event)">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   id="password"
                   placeholder="Enter password"
                   onkeypress="handleEnter(event)">
        </div>

        <button class="btn btn-primary"
                onclick="login()">
            🔐 Sign In
        </button>

        <p style="text-align:center;
                      margin-top:20px;
                      color:#666;
                      font-size:13px;">
            Default: admin / admin123
        </p>
        <!-- Developed By Section -->
        <div style="
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #e0e0e0;
    text-align: center;">

            <p style="
        color: #999;
        font-size: 12px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;">
                Developed By
            </p>

            <p style="
        color: #1a237e;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 4px;">
                Saishiva Akula
            </p>

            <p style="
        color: #666;
        font-size: 13px;
        margin-bottom: 8px;">
                Full Stack Java Developer
            </p>

            <div style="
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 10px;">

                <a href="https://github.com/saishiva00"
                   target="_blank"
                   style="
               color: #333;
               text-decoration: none;
               font-size: 13px;
               display: flex;
               align-items: center;
               gap: 4px;">
                    🐙 GitHub
                </a>

                <a href="https://linkedin.com/in/saishivaakula"
                   target="_blank"
                   style="
               color: #0077b5;
               text-decoration: none;
               font-size: 13px;
               display: flex;
               align-items: center;
               gap: 4px;">
                    💼 LinkedIn
                </a>

                <a href="mailto:saishivaakula9381@gmail.com"
                   style="
               color: #ea4335;
               text-decoration: none;
               font-size: 13px;
               display: flex;
               align-items: center;
               gap: 4px;">
                    📧 Email
                </a>
            </div>

            <p style="
        color: #bbb;
        font-size: 11px;
        margin-top: 15px;">
                © 2026 Library Management System
            </p>
        </div>
    </div>
</div>

<script>
    const API = 'https://librarymanagementsystem-production-1fe8.up.railway.app';

    // Check if already logged in
    window.onload = function() {
        if (localStorage.getItem('user')) {
            window.location.href = 'dashboard.html';
        }
    }

    // Handle Enter key
    function handleEnter(event) {
        if (event.key === 'Enter') login();
    }

    // Login function
    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        // Validation
        if (!username || !password) {
            showAlert('Please enter username and password!', 'danger');
            return;
        }

        try {
            const response = await fetch(`${API}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Save user data
                localStorage.setItem('user', JSON.stringify(data));
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                showAlert(data || 'Invalid credentials!', 'danger');
            }
        } catch (error) {
            showAlert('Cannot connect to server!', 'danger');
        }
    }

    // Show alert message
    function showAlert(message, type) {
        const alert = document.getElementById('alertMsg');
        alert.textContent = message;
        alert.className = `alert alert-${type} show`;
    }
</script>
</body>
</html>
