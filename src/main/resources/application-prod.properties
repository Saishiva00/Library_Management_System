# ===============================
# PRODUCTION CONFIGURATION
# ===============================
spring.application.name=Library-Management

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI}

# Server
server.port=${PORT:8080}
MONGODB_URI = mongodb+srv:/git/libraryuser:library123@cluster0.scul7lj.mongodb.net/librarydb_mongo?appName=Cluster0